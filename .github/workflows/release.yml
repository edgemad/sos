name: "Release build (all platforms)"

# Builds and publishes a GitHub release with installers for every platform:
# macOS (Apple Silicon + Intel .dmg), Windows (.msi/.exe), Linux
# (.deb/.AppImage/.rpm) and Android (.apk). Triggered by pushing a v* tag,
# or manually. Releases are published automatically — a tag ships.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Simple Office Suite v__VERSION__"
          releaseBody: "Offline-first office suite by Talia. All data stays on your machine."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android-apk:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: publish-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Ensure Android NDK
        run: |
          ndk_version=$(ls $ANDROID_HOME/ndk 2>/dev/null | tail -1 || true)
          if [ -z "$ndk_version" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "ndk;26.1.10909125" > /dev/null
            ndk_version=26.1.10909125
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> $GITHUB_ENV

      - name: Build signed APK (debug key)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          npx tauri android init
          npx tauri android build --apk --target aarch64
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" sign \
            --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out Simple.Office.Suite_${GITHUB_REF_NAME#v}_aarch64.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$APKSIGNER" verify Simple.Office.Suite_${GITHUB_REF_NAME#v}_aarch64.apk

      - name: Upload APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Simple.Office.Suite_*_aarch64.apk
