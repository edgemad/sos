name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the GitHub Release and upload installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: ubuntu-latest
            args: "--target aarch64-linux-android"
            android: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Set up Java
        if: matrix.android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        if: matrix.android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android Rust targets
        if: matrix.android
        run: rustup target add aarch64-linux-android

      - name: Install Tauri Android scaffolding
        if: matrix.android
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri android init || true

      - name: Build Android APK
        if: matrix.android
        working-directory: src-tauri
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ''
        run: cargo tauri android build --target aarch64 --apk

      - name: Upload Android APK to release
        if: matrix.android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK" "Simple.Office.Suite_${VERSION}_aarch64.apk"
          gh release upload "$GITHUB_REF_NAME" "Simple.Office.Suite_${VERSION}_aarch64.apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build Tauri app
        if: ${{ !matrix.android }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Simple Office Suite v__VERSION__"
          releaseBody: "Offline-first office suite — docs, sheets, slides, forms, keep and calendar. See the assets below for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
