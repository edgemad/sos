<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Simple Office Suite logo: an open briefcase of four work tools -->
  <defs>
    <linearGradient id="sos-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#7248b9"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#sos-g)"/>
  <!-- handle -->
  <path d="M48 26h32v10H70v-2a6 6 0 0 0-12 0v2H48z" fill="#ffffff" opacity=".92"/>
  <!-- case body -->
  <rect x="26" y="40" width="76" height="52" rx="10" fill="#ffffff"/>
  <!-- four tiles: docs, sheets, slides, forms -->
  <rect x="35" y="49" width="26" height="14" rx="3" fill="#1a73e8"/>
  <rect x="67" y="49" width="26" height="14" rx="3" fill="#0f9d58"/>
  <rect x="35" y="69" width="26" height="14" rx="3" fill="#f4b400"/>
  <rect x="67" y="69" width="26" height="14" rx="3" fill="#7248b9"/>
  <!-- clasps -->
  <rect x="60" y="60" width="8" height="12" rx="2" fill="#dadce0"/>
</svg>
